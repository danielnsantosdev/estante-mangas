name: Teste verificador de imagens
on:
  push:
    paths: [".github/workflows/teste-nsfw.yml", "src/nsfw.js", "scripts/teste-nsfw.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p /tmp/out
          npm install --no-audit --no-fund --no-save nsfwjs@4 @tensorflow/tfjs@4 esbuild@0.21.5 > /tmp/out/install.txt 2>&1 || true
          (cat node_modules/nsfwjs/package.json; find node_modules/nsfwjs -maxdepth 3 | head -80) > /tmp/out/pacote.txt 2>&1
          npx esbuild src/nsfw.js --bundle --minify --format=iife --target=es2019,chrome90 --outfile=/tmp/out/nsfw.js > /tmp/out/esbuild.txt 2>&1 || true
          ls -la /tmp/out >> /tmp/out/esbuild.txt
          node scripts/teste-nsfw.mjs > /tmp/out/node.txt 2>&1 || true
          rm -f /tmp/out/nsfw.js
      - run: |
          git config user.name "teste"; git config user.email "teste@users.noreply.github.com"
          git checkout --orphan resultado-teste
          git rm -rq --cached . ; rm -rf ./* .github
          cp /tmp/out/* .
          git add *.txt; git commit -qm "resultado"; git push -f origin resultado-teste
