# Ranking: roda todo dia às 3h da manhã (horário de Brasília), sem precisar atualizar o app.
#  - todo dia: histórico de leituras, Em alta, Esta semana, Este mês e "Quem lê";
#  - dia 1º: também recalcula "Todos os tempos".
# Rodando manualmente (aba Actions → "Ranking" → Run workflow), recalcula tudo na hora.
name: Ranking

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar o acesso ao Firebase
        working-directory: scripts
        run: npm init -y >/dev/null && npm install --no-audit --no-fund firebase-admin@12
      - name: Calcular e salvar o ranking
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MODO: ${{ github.event_name == 'workflow_dispatch' && 'tudo' || 'auto' }}
        run: node ranking.js
