# Calcula o ranking todo dia 1º, às 3h da manhã (horário de Brasília), sem precisar atualizar o app.
# Também pode ser rodado manualmente: aba Actions → "Ranking mensal" → Run workflow.
name: Ranking mensal

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar o acesso ao Firebase
        working-directory: scripts
        run: npm init -y >/dev/null && npm install --no-audit --no-fund firebase-admin@12
      - name: Calcular e salvar o ranking
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node ranking.js
