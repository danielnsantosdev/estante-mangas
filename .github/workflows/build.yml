# Compila o app automaticamente sempre que algo é enviado ao GitHub.
# Resultado: uma página "Releases" com EstanteMangas.apk (Android) e EstanteMangas-Setup.exe (Windows).
name: Gerar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - name: Número da versão
        shell: bash
        run: echo "window.APP_VERSION = ${{ github.run_number }};" > www/version.js
      - run: npx cap add android
      - name: Ícone do app e número da versão
        run: |
          cp -r android-res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Compilar APK (tenta até 3 vezes se o servidor de peças estiver ocupado)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon && break; echo "Tentativa $i falhou, esperando 60s..."; sleep 60; [ $i = 3 ] && exit 1; done
      - name: Assinar APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          # Limpa espaços, quebras de linha ou caracteres invisíveis que vêm junto ao copiar e colar
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -cd 'A-Za-z0-9')
          KS_B64=$(printf '%s' "$KS_B64" | tr -cd 'A-Za-z0-9+/=')
          export KS_PASS
          echo "Senha: ${#KS_PASS} caracteres (esperado 24) | Chave: ${#KS_B64} caracteres (esperado 3556)"
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > ks.p12
            keytool -list -storetype PKCS12 -keystore ks.p12 -storepass "$KS_PASS" >/dev/null || { echo "::error::A senha ou a chave dos segredos não confere. Confira os segredos ANDROID_KEY_PASSWORD e ANDROID_KEYSTORE."; exit 1; }
            $BT/apksigner sign --ks ks.p12 --ks-pass env:KS_PASS --key-pass env:KS_PASS --out EstanteMangas.apk aligned.apk
            rm -f ks.p12
          else
            echo "::warning::Segredos ANDROID_KEYSTORE/ANDROID_KEY_PASSWORD não configurados: usando assinatura temporária."
            keytool -genkeypair -storetype PKCS12 -keystore tmp.p12 -alias tmp -keyalg RSA -keysize 2048 -validity 10000 -storepass tmppass -keypass tmppass -dname "CN=tmp"
            $BT/apksigner sign --ks tmp.p12 --ks-pass pass:tmppass --out EstanteMangas.apk aligned.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: EstanteMangas.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Número da versão
        shell: bash
        run: echo "window.APP_VERSION = ${{ github.run_number }};" > www/version.js
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/EstanteMangas-Setup.exe }

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arquivos, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Estante de Mangás v1.${{ github.run_number }}
          make_latest: true
          body: |
            📱 **Android:** baixe `EstanteMangas.apk` e abra (permita "instalar apps desconhecidos" se o celular pedir).
            💻 **Windows:** baixe `EstanteMangas-Setup.exe` e abra (se aparecer "O Windows protegeu o computador", clique em *Mais informações* → *Executar assim mesmo*).
          files: |
            arquivos/EstanteMangas.apk
            arquivos/EstanteMangas-Setup.exe
