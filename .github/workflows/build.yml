# Compila o app automaticamente sempre que algo é enviado ao GitHub.
# Resultado: uma página "Releases" com EstanteMangas.apk (Android) e EstanteMangas-Setup.exe (Windows).
name: Gerar app

on:
  push:
    branches: [main]
    paths-ignore: ["sinopses/**", "scripts/sinopses.js", "scripts/deepl.js", "scripts/mal.js", ".github/workflows/sinopses.yml", ".github/workflows/traducao.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - name: Número da versão e chaves da busca de GIF
        shell: bash
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: |
          echo "window.APP_VERSION = ${{ github.run_number }};" > www/version.js
          G=$(printf '%s' "$GIPHY_KEY" | tr -cd 'A-Za-z0-9_-'); K=$(printf '%s' "$KLIPY_KEY" | tr -cd 'A-Za-z0-9_-')
          printf 'window.GIF_KEYS = { giphy: "%s", klipy: "%s" };\n' "$G" "$K" >> www/version.js
      - run: npx cap add android
      - name: Ícone do app e número da versão
        run: |
          cp -r android-res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Compilar APK (tenta até 3 vezes se o servidor de peças estiver ocupado)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon && break; echo "Tentativa $i falhou, esperando 60s..."; sleep 60; [ $i = 3 ] && exit 1; done
      - name: Assinar APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          pip install --quiet cryptography
          # A chave é gerada a partir da senha e conferida com o certificado salvo no repositório
          python3 android-sign/derive_key.py key.pk8 --cert android-sign/cert.pem
          $BT/apksigner sign --key key.pk8 --cert android-sign/cert.pem --out EstanteMangas.apk aligned.apk
          rm -f key.pk8
          $BT/apksigner verify EstanteMangas.apk && echo "APK assinado com sucesso"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: EstanteMangas.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Número da versão e chaves da busca de GIF
        shell: bash
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: |
          echo "window.APP_VERSION = ${{ github.run_number }};" > www/version.js
          G=$(printf '%s' "$GIPHY_KEY" | tr -cd 'A-Za-z0-9_-'); K=$(printf '%s' "$KLIPY_KEY" | tr -cd 'A-Za-z0-9_-')
          printf 'window.GIF_KEYS = { giphy: "%s", klipy: "%s" };\n' "$G" "$K" >> www/version.js
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/EstanteMangas-Setup.exe }

  site:
    # Versão para iPhone (e qualquer navegador): danielnsantosdev.github.io/estante-mangas
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - name: Número da versão e chaves da busca de GIF
        shell: bash
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          KLIPY_KEY: ${{ secrets.KLIPY_KEY }}
        run: |
          echo "window.APP_VERSION = ${{ github.run_number }};" > www/version.js
          G=$(printf '%s' "$GIPHY_KEY" | tr -cd 'A-Za-z0-9_-'); K=$(printf '%s' "$KLIPY_KEY" | tr -cd 'A-Za-z0-9_-')
          printf 'window.GIF_KEYS = { giphy: "%s", klipy: "%s" };\n' "$G" "$K" >> www/version.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arquivos, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Estante de Mangás v1.${{ github.run_number }}
          make_latest: true
          body: |
            📱 **Android:** baixe `EstanteMangas.apk` e abra (permita "instalar apps desconhecidos" se o celular pedir).
            💻 **Windows:** baixe `EstanteMangas-Setup.exe` e abra (se aparecer "O Windows protegeu o computador", clique em *Mais informações* → *Executar assim mesmo*).
          files: |
            arquivos/EstanteMangas.apk
            arquivos/EstanteMangas-Setup.exe
