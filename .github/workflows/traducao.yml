# De hora em hora: tradução das sinopses novas com o DeepL e conferência do MyAnimeList (anime e situação).
# As obras novas aparecem primeiro com a tradução rápida do app e, em até 1 hora, ganham a versão do DeepL.
name: Tradução

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["scripts/deepl.js", "scripts/mal.js", ".github/workflows/traducao.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traducao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar o acesso ao Firebase
        working-directory: scripts
        run: npm init -y >/dev/null && npm install --no-audit --no-fund firebase-admin@12
      - name: Testar a chave do DeepL (só quando a rotina muda)
        if: github.event_name == 'push'
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          MODO: teste
        run: node deepl.js
      - name: Traduzir as sinopses novas
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: node deepl.js
      - name: Testar o MyAnimeList com o One Piece (só quando a rotina muda)
        if: github.event_name == 'push'
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MODO: diag
        run: node mal.js
      - name: Guardar o resultado do teste
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add sinopses/diag-mal.json
          git diff --cached --quiet || (git commit -m "Teste do MyAnimeList [skip ci]" && git pull --rebase -q && git push)
      - name: Conferir anime e situação no MyAnimeList
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node mal.js
